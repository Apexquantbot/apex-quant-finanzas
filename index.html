<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Apex Quant Finanzas</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c1322">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* ============================================================
       Apex Quant Finanzas
       Una sola app con dos secciones independientes:
         - Pro      -> la web de Apex Quant Pro (análisis de acciones)
         - Mercados -> la web del bot de señales de mercados
       Cada app sigue en su propio repositorio, con sus datos,
       sus avisos y su cron. Esta app solo las junta.
       ============================================================ */
    :root {
      --bg: #070e1d;
      --bar: #0c1322;
      --borde: #1e293b;
      --texto: #f1f5f9;
      --apagado: #94a3b8;
      --verde: #00f59b;
      --cian: #00d2ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--texto); overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh;
    }

    /* ---------- Barra de pestañas ---------- */
    .barra {
      flex: 0 0 auto;
      background: var(--bar);
      border-bottom: 1px solid var(--borde);
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .pestanas {
      flex: 1; display: flex; gap: 4px;
      background: var(--bg); border: 1px solid var(--borde);
      border-radius: 14px; padding: 4px;
    }
    .pestana {
      flex: 1; border: 0; cursor: pointer;
      background: transparent; color: var(--apagado);
      font-family: inherit; font-weight: 700; font-size: 15px; line-height: 1;
      padding: 11px 6px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background .2s, color .2s;
    }
    .pestana .ico { font-size: 18px; line-height: 1; }
    .pestana[aria-selected="true"] {
      background: linear-gradient(135deg, var(--verde), var(--cian));
      color: #04121f;
      box-shadow: 0 2px 12px rgba(0, 245, 155, .25);
    }
    .recargar {
      flex: 0 0 auto; width: 44px; height: 44px;
      border: 1px solid var(--borde); border-radius: 12px;
      background: var(--bg); color: var(--verde);
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .recargar.girando span { display: inline-block; animation: giro .7s linear; }
    @keyframes giro { to { transform: rotate(360deg); } }

    /* ---------- Zona de las apps ---------- */
    .zona { flex: 1 1 auto; position: relative; min-height: 0; }
    .zona iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: var(--bg);
      visibility: hidden;
    }
    .zona iframe.activa { visibility: visible; }

    /* Aviso de carga / sin conexión */
    .aviso {
      position: absolute; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 24px; color: var(--apagado);
      background: var(--bg); z-index: 2;
    }
    .aviso.visible { display: flex; }
    .aviso .spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--borde); border-top-color: var(--verde);
      animation: giro .8s linear infinite;
    }
    .aviso button {
      border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
      background: linear-gradient(135deg, var(--verde), var(--cian));
      color: #04121f; font-family: inherit; font-weight: 700; font-size: 14px;
    }
    /* ---------- Apaisado: móvil girado, tablet o pantalla del coche ----------
       Si la pantalla es más ancha que alta y de poca altura, las pestañas pasan
       a una barra vertical a la izquierda y la app aprovecha todo el alto. */
    @media (orientation: landscape) and (max-height: 640px) {
      body { flex-direction: row; }
      .barra {
        flex-direction: column; justify-content: space-between; gap: 10px;
        width: calc(84px + env(safe-area-inset-left, 0px));
        padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px
                 calc(env(safe-area-inset-bottom, 0px) + 8px)
                 calc(env(safe-area-inset-left, 0px) + 8px);
        border-bottom: 0; border-right: 1px solid var(--borde);
      }
      .pestanas { flex: 0 0 auto; flex-direction: column; width: 100%; }
      .pestana { flex-direction: column; gap: 5px; padding: 12px 2px; font-size: 11px; }
      .pestana .ico { font-size: 22px; }
      .recargar { width: 100%; }
    }
    /* Tablet grande en apaisado: barra arriba, pestañas centradas */
    @media (orientation: landscape) and (min-height: 641px) {
      .pestanas { max-width: 560px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <header class="barra">
    <nav class="pestanas" role="tablist" aria-label="Sección">
      <button class="pestana" role="tab" data-seccion="pro" aria-selected="false">
        <span class="ico">💎</span>Pro
      </button>
      <button class="pestana" role="tab" data-seccion="mercados" aria-selected="false">
        <span class="ico">📈</span>Mercados
      </button>
    </nav>
    <button class="recargar" id="recargar" aria-label="Recargar" title="Recargar"><span>↻</span></button>
  </header>

  <main class="zona" id="zona">
    <div class="aviso" id="aviso">
      <div class="spin" id="avisoSpin"></div>
      <p id="avisoTexto">Cargando…</p>
      <button id="avisoBoton" style="display:none">Reintentar</button>
    </div>
  </main>

  <script>
    // ------------------------------------------------------------
    // Direcciones de cada app (sus webs de GitHub Pages).
    // Si algún día mueves una de sitio, solo hay que cambiar aquí.
    // ------------------------------------------------------------
    const APPS = {
      pro:      'https://apexquantbot.github.io/apex-quant-pro/',
      mercados: 'https://apexquantbot.github.io/bot-quant-mercados/'
    };
    const CLAVE = 'apexFinanzas.ultimo';
    const NOMBRES = { pro: 'Apex Quant Pro', mercados: 'Apex Quant Mercados' };

    const zona   = document.getElementById('zona');
    const aviso  = document.getElementById('aviso');
    const avisoT = document.getElementById('avisoTexto');
    const avisoS = document.getElementById('avisoSpin');
    const avisoB = document.getElementById('avisoBoton');
    const marcos = {};      // iframes ya creados (se crean al abrir cada pestaña por primera vez)
    const cargado = {};
    let actual = null;
    let temporizador = null;

    function leerUltimo() {
      try { return localStorage.getItem(CLAVE); } catch (e) { return null; }
    }
    function guardarUltimo(d) {
      try { localStorage.setItem(CLAVE, d); } catch (e) {}
    }

    function mostrarAviso(modo) {
      clearTimeout(temporizador);
      if (modo === 'cargando') {
        avisoS.style.display = ''; avisoB.style.display = 'none';
        avisoT.textContent = 'Cargando…';
        aviso.classList.add('visible');
        // Si tarda mucho, ofrecer reintentar (p. ej. sin cobertura)
        temporizador = setTimeout(() => {
          if (!cargado[actual]) mostrarAviso('error');
        }, 15000);
      } else if (modo === 'error') {
        avisoS.style.display = 'none'; avisoB.style.display = '';
        avisoT.textContent = navigator.onLine
          ? 'Está tardando más de lo normal en cargar.'
          : 'Sin conexión a internet.';
        aviso.classList.add('visible');
      } else {
        aviso.classList.remove('visible');
      }
    }

    function crearMarco(d) {
      const f = document.createElement('iframe');
      f.title = NOMBRES[d];
      f.allow = 'clipboard-read; clipboard-write; web-share; fullscreen';
      f.referrerPolicy = 'no-referrer';
      f.addEventListener('load', () => {
        cargado[d] = true;
        if (actual === d) mostrarAviso(null);
      });
      f.src = APPS[d];
      zona.appendChild(f);
      marcos[d] = f;
      return f;
    }

    function abrir(d) {
      if (!APPS[d]) d = 'pro';
      actual = d;
      document.querySelectorAll('.pestana').forEach(b =>
        b.setAttribute('aria-selected', String(b.dataset.seccion === d)));
      if (!marcos[d]) { cargado[d] = false; crearMarco(d); }
      Object.entries(marcos).forEach(([k, f]) => f.classList.toggle('activa', k === d));
      mostrarAviso(cargado[d] ? null : 'cargando');
      guardarUltimo(d);
      if (location.hash !== '#' + d) history.replaceState(null, '', '#' + d);
    }

    function recargar() {
      const f = marcos[actual];
      if (!f) return;
      cargado[actual] = false;
      mostrarAviso('cargando');
      f.src = APPS[actual] + '?t=' + Date.now();
      const r = document.getElementById('recargar');
      r.classList.remove('girando'); void r.offsetWidth; r.classList.add('girando');
    }

    document.querySelectorAll('.pestana').forEach(b =>
      b.addEventListener('click', () => abrir(b.dataset.seccion)));
    document.getElementById('recargar').addEventListener('click', recargar);
    avisoB.addEventListener('click', recargar);
    window.addEventListener('online', () => { if (!cargado[actual]) recargar(); });

    // Arranque: #pro / #mercados en la dirección, o la última pestaña usada
    const inicial = location.hash.replace('#', '') || leerUltimo() || 'pro';
    abrir(inicial);

    // Precarga la otra pestaña unos segundos después, para que el cambio sea instantáneo
    setTimeout(() => {
      const otra = actual === 'pro' ? 'mercados' : 'pro';
      if (!marcos[otra]) crearMarco(otra);
    }, 4000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
